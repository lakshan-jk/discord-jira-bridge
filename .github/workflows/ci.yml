name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest

    # Real Postgres for the integration tests (the actual SQL end to end).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jumeau
          POSTGRES_PASSWORD: jumeau
          POSTGRES_DB: jumeau
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jumeau -d jumeau"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Integration tests (real Postgres)
        run: npm run test:integration
        env:
          DATABASE_URL: postgres://jumeau:jumeau@localhost:5432/jumeau

  docker:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: test
    # Only on a merge/push to main — not on PRs or feature branches.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/discord-jira-bridge:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/discord-jira-bridge:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
